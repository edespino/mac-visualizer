name: CI

# Builds the app target and runs the full XCTest suite on a GitHub-hosted
# macOS runner for pushes and PRs to main and dev (development happens on dev,
# so it is a trigger too; main only receives the release fast-forward).

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# Least privilege: the test job only needs to read repository contents.
permissions:
  contents: read

jobs:
  test:
    name: Build & test (macOS)
    runs-on: macos-15
    steps:
      # Third-party action pinned to a full commit SHA (actions/checkout v7.0.1,
      # which runs on Node 24; the older v4 pin targeted the deprecated Node 20).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Select the newest stable Xcode on the runner image. The project needs
      # Xcode 16+ (macos-15 ships 16.x); latest-stable avoids pinning an exact
      # version that may not exist on the image. Third-party action pinned to a
      # full commit SHA (maxim-lobanov/setup-xcode v1.7.0).
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: latest-stable

      # `brew install xcodegen` floats to the current Homebrew formula version.
      # Acceptable here: XcodeGen project generation is stable across recent
      # releases. Pin (e.g. a fixed bottle) if a regression ever appears.
      - name: Install XcodeGen
        run: brew install xcodegen

      # Build the app target so CI exercises the MacVisualizer application —
      # its signing config (CODE_SIGN_ENTITLEMENTS, ENABLE_HARDENED_RUNTIME)
      # and the bundled icon. `make test` alone builds only MacVisualizerCore
      # and the Core tests, not the app target.
      - name: Build app target
        run: make build

      - name: Run test suite
        run: make test
