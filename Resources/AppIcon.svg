<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Blue palette: bright cyan to mid blue to deep indigo, swept across the icon width. -->
    <linearGradient id="spectrum" gradientUnits="userSpaceOnUse" x1="80" y1="0" x2="944" y2="0">
      <stop offset="0%"   stop-color="#00E5FF"/>
      <stop offset="50%"  stop-color="#2196F3"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <!-- Same sweep in the mark's 200x200 design coordinates (icon x 80..944 maps to design x 6.087..193.913 at scale 4.6). -->
    <linearGradient id="spectrumMark" gradientUnits="userSpaceOnUse" x1="6.087" y1="0" x2="193.913" y2="0">
      <stop offset="0%"   stop-color="#00E5FF"/>
      <stop offset="50%"  stop-color="#2196F3"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <!-- The e carries a 10 degree rotation; counter-rotate its gradient so the sweep stays horizontal. -->
    <linearGradient id="spectrumMarkE" gradientUnits="userSpaceOnUse" x1="6.087" y1="0" x2="193.913" y2="0" gradientTransform="rotate(-10 140 100)">
      <stop offset="0%"   stop-color="#00E5FF"/>
      <stop offset="50%"  stop-color="#2196F3"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <!-- Soft glow filter to evoke neon -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Black background, full bleed -->
  <rect x="0" y="0" width="1024" height="1024" fill="black"/>

  <!-- Audio-spectrum bars. Bottoms aligned at y=512. -->
  <g fill="url(#spectrum)" filter="url(#neonGlow)">
    <rect x="80"  y="432" width="30" height="80"/>
    <rect x="128" y="392" width="30" height="120"/>
    <rect x="176" y="312" width="30" height="200"/>
    <rect x="224" y="262" width="30" height="250"/>
    <rect x="272" y="332" width="30" height="180"/>
    <rect x="320" y="272" width="30" height="240"/>
    <rect x="368" y="212" width="30" height="300"/>
    <rect x="416" y="252" width="30" height="260"/>
    <rect x="464" y="312" width="30" height="200"/>
    <rect x="512" y="282" width="30" height="230"/>
    <rect x="560" y="232" width="30" height="280"/>
    <rect x="608" y="292" width="30" height="220"/>
    <rect x="656" y="242" width="30" height="270"/>
    <rect x="704" y="332" width="30" height="180"/>
    <rect x="752" y="282" width="30" height="230"/>
    <rect x="800" y="352" width="30" height="160"/>
    <rect x="848" y="402" width="30" height="110"/>
    <rect x="896" y="442" width="30" height="70"/>
  </g>

  <!-- Sign-off mark: dash, equals, e. 200x200 design box, scale 4.6 about its center, centered at (512 710). -->
  <g filter="url(#neonGlow)">
    <g transform="translate(512 710) scale(4.6) translate(-100 -100)" fill="none" stroke-linecap="round">
      <path d="M30 104H50" stroke="url(#spectrumMark)" stroke-width="6" opacity="0.55"/>
      <path d="M64 94H92" stroke="url(#spectrumMark)" stroke-width="8" opacity="0.8"/>
      <path d="M64 112H92" stroke="url(#spectrumMark)" stroke-width="8" opacity="0.8"/>
      <path d="M112 100H168A28 28 0 1 0 159 121" stroke="url(#spectrumMarkE)" stroke-width="10" transform="rotate(10 140 100)"/>
    </g>
  </g>
</svg>
